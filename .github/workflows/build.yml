name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create after both builds succeed
        required: true
        default: v1.3.1

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt 2>$null
          pip install pyinstaller
      - name: Build
        run: .\build_windows_onedir.ps1
        shell: pwsh
      - name: Store Windows package
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: dist/*_windows_x64.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build
        run: bash build_mac.sh
      - name: Store macOS package
        uses: actions/upload-artifact@v7
        with:
          name: macos-package
          path: dist/*_macos.zip
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-package'
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          RELEASE_TAG="${DISPATCH_TAG:-${GITHUB_REF_NAME}}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Auto Playlist Maker $RELEASE_TAG" \
              --notes-file release_notes.md
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Auto Playlist Maker $RELEASE_TAG" \
              --notes-file release_notes.md
          fi
          gh release upload "$RELEASE_TAG" \
            release-assets/*.zip setup.bat setup_mac.sh --clobber
